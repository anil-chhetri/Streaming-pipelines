version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:latest
    hostname: ksqldb-server
    container_name: ksqldb-server
    depends_on:
      - kafka
    ports:
      - "8088:8088"
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081 # Add if using Schema Registry
      KSQL_KSQL_SERVICE_ID: "uniqueId" # Ensure this is unique if running multiple ksqlDB servers

  # Optional: Add Schema Registry if you plan to use Avro, Protobuf, or JSON Schema
  # schema-registry:
  #   image: confluentinc/cp-schema-registry:latest
  #   hostname: schema-registry
  #   container_name: schema-registry
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     SCHEMA_REGISTRY_HOST_NAME: schema-registry
  #     SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092

  control-center:
    image: confluentinc/cp-enterprise-control-center:latest
    hostname: control-center
    container_name: control-center
    depends_on:
      - kafka
      - ksqldb-server
      # - schema-registry # Uncomment if you added schema-registry
    ports:
      - "9021:9021" # Port to access Control Center in your browser
    environment:
      # Basic Control Center Configuration
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_ZOOKEEPER_CONNECT: zookeeper:2181
      CONTROL_CENTER_REPLICATION_FACTOR: 1 # For development, use 1

      # Point Control Center to other services
      CONTROL_CENTER_KSQL_URL: http://ksqldb-server:8088
      CONTROL_CENTER_KSQL_ADVERTISED_URL: http://ksqldb-server:8088 # Often the same as KSQL_URL in Docker
      # CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081 # Uncomment if you added schema-registry

      # Minimal required internal topic configuration
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONTROL_CENTER_STREAMSTOWIZARD_TOPIC_PARTITIONS: 1

      # Set up a basic username and password (for development only!)
      CONTROL_CENTER_BASIC_AUTH_USER: "admin"
      CONTROL_CENTER_BASIC_AUTH_PASSWORD: "password"
      CONTROL_CENTER_BASIC_AUTH_ENABLED: "true"

      # Data retention for Control Center's internal topics (adjust as needed)
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMSTOWIZARD_TOPIC_REPLICATION: 1
      CONTROL_CENTER_PROCESSOR_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMING_TOPIC_REPLICATION: 1

      # Some additional configurations for development
      CONTROL_CENTER_ID: "control_center_id" # Ensure unique if multiple Control Centers
      CONTROL_CENTER_CLEANUP_POLICY: "compact"